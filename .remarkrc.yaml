# remark-lint configuration — https://github.com/remarkjs/remark-lint
#
# Loads the markdown-style-guide preset, but disables the line-length and
# heading-length rules: author-chosen prose width is allowed.
plugins:
  - remark-preset-lint-markdown-style-guide
  - [remark-lint-maximum-line-length, false]
  - [remark-lint-maximum-heading-length, false]
