name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "talks/**"
      - "mkdocs.yml"
      - "requirements.txt"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # so mkdocs can pick up file last-modified times

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip

      - name: Install build dependencies
        run: pip install -r requirements.txt

      - name: Build site
        run: mkdocs build --site-dir site

      # the decks are served as plain files next to the docs' Talks page (talks.md → site/talks/index.html), so that
      # the gr4-present viewer can read them: ?presentation=https://fair-acc.github.io/gremlin/talks/<deck>/
      - name: Add the talk decks
        run: |
          cp -r talks/. site/talks/
          rm site/talks/README.md   # the how-to for contributors stays in the repository

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
