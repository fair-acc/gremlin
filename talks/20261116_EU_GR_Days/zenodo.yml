title: "GREMLIN — Finding What Machines Don't Tell You"
description: >-
  <p>Passive RF diagnostics and machine-state inference at FAIR. A 10-minute show-and-tell at the European GNU Radio
  Days 2026, Rennes.</p>
  <p>GREMLIN explores how much can be learned about complex small- and large-scale infrastructure and technical
  systems from the emitted RF signals they already produce. The talk presents ongoing work at FAIR as part of the EU
  iRIS project, combining high-rate RF signal acquisition, modern C++/DSP, time-series replay and
  machine-learning-assisted inference to detect hidden states, anomalies and correlations across distributed
  equipment, using maintainable, software-defined instrumentation based on GNU Radio 4.0.</p>
  <p>The record holds the slides as PDF, one page per slide and one page per step, and the gr4-present deck itself
  (zip, with speaker notes).</p>
